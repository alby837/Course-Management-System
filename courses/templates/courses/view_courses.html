{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>View Courses</title>

    <link rel="stylesheet" href="{% static 'courses/css/style.css' %}">
</head>
<body>

<div class="container">

<h1>Course List</h1>

<table border="1" cellpadding="10" cellspacing="0">

<tr>
    <th>Sl.No</th>
    <th>Course Name</th>
    <th>Course Code</th>
    <th>Duration</th>
    <th>Fee</th>
    <th>Action</th>
</tr>

{% for course in courses %}

<tr>

<td>{{ forloop.counter }}</td>
<td>{{ course.course_name }}</td>
<td>{{ course.course_code }}</td>
<td>{{ course.duration }}</td>
<td>{{ course.fee }}</td>

<td>
   <a href="{% url 'edit_course' course.id %}">Edit</a> |
   <a href="{% url 'delete_course' course.id %}" onclick="return confirm('Are you sure you want to delete this course?')">Delete</a>
</td>

</tr>

{% endfor %}

</table>

<br>

<a href="{% url 'home' %}">Back to Home</a>

</div>

</body>
</html>
