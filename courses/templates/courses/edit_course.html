{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Course</title>
    <link rel="stylesheet" href="{% static 'courses/css/style.css' %}">
</head>
<body>

<div class="container">

<h1>Edit Course</h1>

<form method="POST">

{% csrf_token %}

<input type="text" name="course_name" value="{{ course.course_name }}"><br><br>

<input type="text" name="course_code" value="{{ course.course_code }}"><br><br>

<input type="text" name="duration" value="{{ course.duration }}"><br><br>

<input type="text" name="fee" value="{{ course.fee }}"><br><br>

<button type="submit">Update Course</button>

</form>

<br>

<a href="{% url 'view_courses' %}">Back</a>

</div>

</body>
</html>
